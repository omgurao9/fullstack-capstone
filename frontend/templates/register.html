{% extends "base.html" %}
{% block title %}Sign up | Cars Dealership{% endblock %}
{% block content %}
<div class="form-card"><h1>Create your account</h1><p>Register to share your dealership experience.</p>
<form id="register-form">
<label for="username">Username</label><input id="username" name="username" required>
<label for="first_name">First Name</label><input id="first_name" name="first_name" required>
<label for="last_name">Last Name</label><input id="last_name" name="last_name" required>
<label for="email">Email</label><input id="email" name="email" type="email" required>
<label for="password">Password</label><input id="password" name="password" type="password" required minlength="8">
<button class="btn btn-success" type="submit">Register</button><p id="register-result" role="status"></p>
</form></div>
<script>
document.getElementById('register-form').addEventListener('submit', async (event) => {
  event.preventDefault();
  const form = new FormData(event.currentTarget);
  const payload = Object.fromEntries(form.entries());
  const response = await fetch('/api/register/', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
  const result = await response.json();
  document.getElementById('register-result').textContent = result.message || result.error || 'Request completed';
});
</script>
{% endblock %}
